<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>微觀世界觀測台 — 國中理化 3D 教學版</title>
<style>
  :root{
    --ink:#050d12; --panel:#0d1c25; --panel-2:#0a161d;
    --line:#1b333f; --line-soft:#132a34;
    --text:#dcecf1; --dim:#7f9aa5;
    --accent:#ff6a53;  --accent-soft:rgba(255,106,83,.14);
    --metal:#ffb347; --nonmetal:#63d9e0; --noble:#b58cf0; --semi:#9fd07a;
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
    --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --hdr:52px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  button{touch-action:manipulation}
  .app{min-height:100%;display:flex;flex-direction:column}

  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 22px 12px;border-bottom:1px solid var(--line-soft)}
  h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.1em}
  h1 span{color:var(--accent)}
  .sub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--dim)}
  .tabs{margin-left:auto;display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px}
  .tabs button{appearance:none;border:0;background:transparent;color:var(--dim);font-family:var(--sans);
    font-size:13.5px;padding:8px 16px;border-radius:999px;cursor:pointer;transition:.15s}
  .tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}

  /* ---- 選擇區 ---- */
  .picker{border-bottom:1px solid var(--line-soft);padding:14px 22px 16px;overflow-x:auto}
  .pwrap{--cell:44px;--gap:4px;overflow-x:auto;padding-bottom:2px}
  .pwrap.compact{--cell:58px}
  .phead,.ptable{display:grid;gap:var(--gap);justify-content:center;align-content:start}
  .phead{grid-template-rows:14px;margin-bottom:4px}
  .ptable{grid-template-rows:repeat(7,var(--cell))}
  /* 完整週期表多一條註腳列放錒系，中間留一道空隙與主表格分開 */
  .pwrap.full .ptable{grid-template-rows:repeat(7,var(--cell)) 13px var(--cell)}
  .fnlab{grid-row:9;grid-column:1/6;align-self:center;justify-self:end;
    font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim);padding-right:6px}
  .pwrap.full .phead,.pwrap.full .ptable{grid-template-columns:repeat(18,var(--cell));
    min-width:calc(18 * (var(--cell) + var(--gap)))}
  .pwrap.compact .phead,.pwrap.compact .ptable{grid-template-columns:repeat(8,var(--cell))}
  .gapnote{display:flex;align-items:center;justify-content:center;text-align:center;
    border:1px dashed rgba(255,255,255,.06);border-radius:8px;padding:4px 8px;
    font-size:11px;line-height:1.5;color:#3f606d;z-index:0}
  .tmwrap{margin-top:12px}
  .tmwrap .lab{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim);display:block;margin-bottom:7px}
  .tmrow{display:flex;gap:5px;flex-wrap:wrap;--cell:52px}
  .tmrow .el{flex:none}
  .layoutbtn{appearance:none;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--dim);
    border-radius:999px;padding:5px 12px;font-size:11.5px;font-family:var(--sans);margin-left:auto;transition:.13s}
  .layoutbtn:hover{border-color:#2b5361;color:var(--text)}
  .gcol{font-family:var(--mono);font-size:9px;color:#3f606d;text-align:center;
    height:14px;line-height:14px;align-self:end;overflow:hidden}
  .gcol.ga{color:var(--accent);font-weight:700;font-size:10px;letter-spacing:.04em}
  .el{position:relative;align-self:start}
  .el.rad::after{content:'';position:absolute;top:4px;right:4px;width:4px;height:4px;border-radius:50%;background:#e0705a}
  .cell{width:var(--cell);height:var(--cell);border-radius:7px;border:1px dashed rgba(255,255,255,.05)}
  .el{appearance:none;cursor:pointer;padding:2px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1px;transition:.13s;width:var(--cell);height:var(--cell);font-family:var(--sans)}
  .el .z{font-family:var(--mono);font-size:8.5px;color:var(--dim);line-height:1}
  .el .s{font-size:15px;font-weight:800;line-height:1.05}
  .el .n{font-size:9px;color:var(--dim);line-height:1}
  .el:hover{transform:translateY(-2px)}
  .el[data-cat="金屬"]{border-color:rgba(255,179,71,.42)} .el[data-cat="金屬"] .s{color:var(--metal)}
  .el[data-cat="非金屬"]{border-color:rgba(99,217,224,.42)} .el[data-cat="非金屬"] .s{color:var(--nonmetal)}
  .el[data-cat="惰性氣體"]{border-color:rgba(181,140,240,.45)} .el[data-cat="惰性氣體"] .s{color:var(--noble)}
  .el[data-cat="類金屬"]{border-color:rgba(159,208,122,.45)} .el[data-cat="類金屬"] .s{color:var(--semi)}
  .el[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .mnemo{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:13px}
  .mnemo .lab{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim);margin-right:2px}
  .mbtn{appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--panel-2);color:var(--text);
    border-radius:999px;padding:7px 13px;font-size:13px;font-family:var(--sans);transition:.13s}
  .mbtn:hover{border-color:#2b5361}
  .mbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:700}
  .mband{margin-top:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);padding:13px 14px}
  .mband .say{font-size:19px;font-weight:800;letter-spacing:.16em;margin:0 0 11px;color:var(--text)}
  .seqbar{display:flex;gap:6px;align-items:stretch;overflow-x:auto;padding-bottom:3px}
  .seq{appearance:none;cursor:pointer;flex:none;border:1px solid var(--line);background:transparent;color:var(--text);
    border-radius:8px;padding:6px 9px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:.13s;font-family:var(--sans)}
  .seq .o{font-family:var(--mono);font-size:8.5px;color:var(--dim);line-height:1}
  .seq .c{font-size:14px;font-weight:700;line-height:1.15}
  .seq .y{font-family:var(--mono);font-size:9.5px;color:var(--dim);line-height:1}
  .seq:hover{border-color:#2b5361}
  .seq[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .seq[aria-current="true"] .c{color:var(--accent)}
  .mnote{margin:11px 0 0;font-size:13px;line-height:1.85;color:#a8c3cc}
  .el.dim{opacity:.18}
  .keys{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--dim)}
  .keys i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:baseline}

  .chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .chips .lab{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--dim);margin-right:2px}
  .chip{appearance:none;cursor:pointer;border:1px solid var(--line);background:var(--panel-2);color:var(--text);
    border-radius:9px;padding:8px 12px;font-size:13.5px;display:flex;align-items:baseline;gap:6px;transition:.13s}
  .chip small{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
  .chip:hover{border-color:#2b5361}
  .chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .chip[aria-pressed="true"] small{color:var(--accent)}

  /* ---- 主體 ---- */
  .app>.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:480px}
  .stage{position:relative;min-height:50vh;border-right:1px solid var(--line-soft);overflow:hidden;
    background:radial-gradient(720px 500px at 50% 46%, #10242e 0%, #071219 62%, #040b10 100%)}
  canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
  canvas:focus-visible{box-shadow:inset 0 0 0 2px var(--nonmetal)}
  .tag{position:absolute;left:16px;top:14px;pointer-events:none;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:#4d6f7c}
  .readout{position:absolute;left:16px;bottom:14px;pointer-events:none;font-family:var(--mono);font-size:11.5px;color:#5c8391;line-height:1.75}
  .readout b{color:var(--nonmetal);font-weight:500}
  .toolbar{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .tg{display:flex;background:rgba(6,18,24,.75);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(6px)}
  .tg button{appearance:none;border:0;background:transparent;color:var(--dim);font-family:var(--sans);
    font-size:12.5px;padding:6px 12px;border-radius:999px;cursor:pointer;transition:.15s}
  .tg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

  aside{padding:18px 18px 36px;display:flex;flex-direction:column;gap:16px;overflow:auto}
  .card{border:1px solid var(--line-soft);border-radius:14px;background:var(--panel);padding:16px}
  .cap{margin:0 0 10px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--dim)}
  .head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
  .head h2{margin:0;font-size:23px;font-weight:800;letter-spacing:.03em}
  .head .f{font-family:var(--mono);font-size:15px;color:var(--accent)}
  .badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--dim);margin-bottom:12px}
  dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:13.5px}
  dt{color:var(--dim)}
  dd{margin:0;font-family:var(--mono);font-size:12.5px;text-align:right}
  .note{margin:13px 0 0;font-size:13.5px;line-height:1.9;color:#a8c3cc;border-top:1px dashed var(--line);padding-top:12px}
  .legend{display:flex;flex-direction:column;gap:9px}
  .lrow{display:flex;align-items:center;gap:10px;font-size:13px}
  .sw{width:15px;height:15px;border-radius:50%;flex:none;box-shadow:inset -2px -3px 5px rgba(0,0,0,.55),inset 2px 3px 5px rgba(255,255,255,.28)}
  .lrow .sy{font-family:var(--mono);min-width:22px;white-space:nowrap}
  .lrow .nm{color:var(--dim)}
  .srow{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
  input[type=range]{flex:1;accent-color:var(--accent);height:20px}
  .ghost{appearance:none;cursor:pointer;width:100%;border:1px solid var(--line);background:transparent;color:var(--dim);
    border-radius:10px;padding:9px;font-size:13px;transition:.15s;font-family:var(--sans)}
  .ghost:hover{border-color:#2b5361;color:var(--text)}
  .hide{display:none!important}

  @media (max-width:900px){
    .app>.main{grid-template-columns:minmax(0,1fr)}
    .stage{border-right:0;border-bottom:1px solid var(--line-soft);min-height:44vh}
    header{padding:12px 14px} .picker{padding:12px 14px} aside{padding:14px}
    .tabs{width:100%;margin-left:0}
    .tabs button{flex:1}
  }
  /* 平板直放：稍微縮小格子，讓完整週期表不必左右捲 */
  @media (min-width:701px) and (max-width:900px){
    .pwrap.full{--cell:38px;--gap:3px}
  }

  /* ---- 手機版：3D 檢視區固定在上方，下方捲動挑元素（含橫放） ---- */
  @media (max-width:700px), (max-width:900px) and (max-height:560px){
    .app>.main{display:contents}

    header{order:1;position:sticky;top:0;z-index:30;background:var(--ink);
      height:var(--hdr);min-height:var(--hdr);flex-wrap:nowrap;gap:10px;
      padding:0 max(12px,env(safe-area-inset-left)) 0 max(12px,env(safe-area-inset-right));
      border-bottom:1px solid var(--line-soft)}
    h1{font-size:15px;letter-spacing:.04em;white-space:nowrap}
    .sub{display:none}
    .tabs{width:auto;flex:0 1 auto;margin-left:auto;padding:2px}
    .tabs button{flex:none;padding:6px 11px;font-size:12.5px;white-space:nowrap}

    .stage{order:2;position:sticky;top:var(--hdr);z-index:20;
      height:clamp(190px,42vh,360px);min-height:0;
      border-right:0;border-bottom:1px solid var(--line)}
    .toolbar{right:8px;top:8px;gap:6px}
    .tg button{padding:6px 11px;font-size:12px}
    .tag{left:10px;top:9px;font-size:10px;letter-spacing:.12em}
    .readout{left:10px;bottom:9px;font-size:10.5px;line-height:1.65}

    .picker{order:3;padding:12px max(12px,env(safe-area-inset-left)) 14px max(12px,env(safe-area-inset-right))}
    .pwrap.full{--cell:34px;--gap:3px}
    .pwrap.compact{--cell:42px}
    .pwrap.full .el .n{display:none}
    .pwrap.full .el .s{font-size:13px}
    .tmrow{--cell:42px}
    /* 口訣／主族改為單列橫向滑動，避免把週期表推得太下面 */
    #mnemo{display:block;margin-bottom:10px}
    #mnemo>.mnemo{gap:6px;flex-wrap:nowrap;overflow-x:auto;margin-bottom:7px;
      padding-bottom:3px;scrollbar-width:none}
    #mnemo>.mnemo::-webkit-scrollbar{display:none}
    #mnemo .lab,#mnemo .mbtn{flex:none}
    .mbtn{padding:8px 12px;font-size:12.5px}
    .mband{padding:12px}
    .mband .say{font-size:16px;letter-spacing:.1em}
    .mnote{font-size:12.5px;line-height:1.8}
    .keys{gap:9px 12px;font-size:11px}
    .layoutbtn{padding:7px 14px}
    .chip{padding:9px 12px;font-size:13px}

    aside{order:4;overflow:visible;gap:12px;
      padding:12px max(12px,env(safe-area-inset-left)) calc(28px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right))}
    .card{padding:14px}
    .head h2{font-size:20px}
    input[type=range]{height:30px}
    .ghost{padding:11px}
  }
  @media (max-width:380px){
    h1{font-size:14px}
    .tabs button{padding:6px 9px;font-size:12px}
    .pwrap.full{--cell:31px}
    .pwrap.compact{--cell:38px}
  }
  /* 手機橫放：畫面矮，3D 區改用高度比例，並留一點空間看得到下方選單 */
  @media (max-width:900px) and (max-height:560px){
    .stage{height:clamp(150px,55vh,300px)}
    .picker{padding-top:10px}
  }
  /* 觸控裝置不套用 hover 位移，改用按下回饋 */
  @media (hover:none){
    .el:hover{transform:none}
    .el:active{transform:scale(.93)}
    .mbtn:active,.chip:active,.seq:active,.ghost:active,.layoutbtn:active{opacity:.65}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>微觀世界觀測台<span>.</span></h1>
    <span class="sub">國中理化 · 3D</span>
    <div class="tabs" role="tablist">
      <button id="tabEl" role="tab" aria-selected="true">元素與原子</button>
      <button id="tabMol" role="tab" aria-selected="false">分子與晶體</button>
    </div>
  </header>

  <div class="picker">
    <div id="pickEl">
      <div class="mnemo" id="mnemo"></div>
      <div class="pwrap full" id="pwrap">
        <div class="phead" id="phead"></div>
        <div class="ptable" id="ptable"></div>
      </div>
      <div class="tmwrap hide" id="tmwrap">
        <span class="lab">常見過渡元素與錒系</span>
        <div class="tmrow" id="tmrow"></div>
      </div>
      <div class="mband hide" id="mband">
        <p class="say" id="mSay"></p>
        <div class="seqbar" id="mSeq"></div>
        <p class="mnote" id="mNote"></p>
      </div>
      <div class="keys">
        <span><i style="background:var(--metal)"></i>金屬</span>
        <span><i style="background:var(--nonmetal)"></i>非金屬</span>
        <span><i style="background:var(--semi)"></i>類金屬</span>
        <span><i style="background:var(--noble)"></i>惰性氣體（鈍氣）</span>
        <span style="color:#3f606d">右上小點＝放射性元素</span>
        <button class="layoutbtn" id="layoutBtn" type="button"></button>
      </div>
    </div>
    <div id="pickMol" class="hide">
      <div class="chips" id="chipsA" style="margin-bottom:9px"></div>
      <div class="chips" id="chipsB"></div>
    </div>
  </div>

  <div class="main">
    <section class="stage">
      <canvas id="view" tabindex="0" aria-label="三維結構檢視區，可用方向鍵旋轉"></canvas>
      <div class="tag" id="tag"></div>
      <div class="readout" id="readout"></div>
      <div class="toolbar">
        <div class="tg" id="modeGroup">
          <button data-mode="ball" aria-pressed="true">球棍</button>
          <button data-mode="fill" aria-pressed="false">實體</button>
        </div>
        <div class="tg">
          <button id="btnLabel" aria-pressed="true">標示</button>
          <button id="btnSpin" aria-pressed="true">自轉</button>
        </div>
      </div>
    </section>

    <aside>
      <div class="card">
        <div class="head"><h2 id="tName"></h2><span class="f" id="tFormula"></span></div>
        <span class="badge" id="tBadge"></span>
        <dl id="tFacts"></dl>
        <p class="note" id="tNote"></p>
      </div>
      <div class="card" id="legendCard">
        <p class="cap">圖例</p>
        <div class="legend" id="legend"></div>
      </div>
      <div class="card">
        <div class="srow"><span>轉速</span><input id="speed" type="range" min="0" max="100" value="34"></div>
        <div class="srow" style="margin-top:10px"><span>縮放</span><input id="zoom" type="range" min="60" max="220" value="100"></div>
        <button class="ghost" id="reset" style="margin-top:12px">重設視角</button>
        <p style="margin:12px 0 0;font-size:12px;color:var(--dim);line-height:1.7">拖曳可旋轉，滾輪或雙指縮放，也可用方向鍵。</p>
      </div>
    </aside>
  </div>
</div>

<script>
(function(){
"use strict";

/* ==================== 元素資料 ==================== */
/* col/row = 週期表位置；shells = 各層電子數；a = 常見質量數 */
const EL = {
 H :{zh:'氫',z:1,a:1,shells:[1],cat:'非金屬',state:'氣體',col:1,row:1,color:'#eef4f6',cov:0.31,vdw:1.20,
     use:'最輕的元素。燃燒後只生成水，被視為乾淨的燃料。'},
 He:{zh:'氦',z:2,a:4,shells:[2],cat:'惰性氣體',state:'氣體',col:18,row:1,color:'#c6f4ff',cov:0.28,vdw:1.40,
     use:'比空氣輕又幾乎不與任何物質反應，用來填充氣球與飛船。'},
 Li:{zh:'鋰',z:3,a:7,shells:[2,1],cat:'金屬',state:'固體',col:1,row:2,color:'#cc80ff',cov:1.28,vdw:1.82,
     use:'最輕的金屬，是手機與電動車鋰電池的主角。'},
 Be:{zh:'鈹',z:4,a:9,shells:[2,2],cat:'金屬',state:'固體',col:2,row:2,color:'#c2ff3d',cov:0.96,vdw:1.53,
     use:'又輕又硬，多用在飛機與精密儀器的合金。'},
 B :{zh:'硼',z:5,a:11,shells:[2,3],cat:'類金屬',state:'固體',col:13,row:2,color:'#ffb5b5',cov:0.84,vdw:1.92,
     use:'加進玻璃可以耐熱，實驗室的燒杯多半含硼。'},
 C :{zh:'碳',z:6,a:12,shells:[2,4],cat:'非金屬',state:'固體',col:14,row:2,color:'#5d6673',cov:0.76,vdw:1.70,

/* ==================== 分子與晶體 ==================== */
function autoBonds(atoms,max){const b=[];for(let i=0;i<atoms.length;i++)for(let j=i+1;j<atoms.length;j++){
  const dx=atoms[i][1]-atoms[j][1],dy=atoms[i][2]-atoms[j][2],dz=atoms[i][3]-atoms[j][3];
  if(dx*dx+dy*dy+dz*dz<max*max)b.push([i,j,1]);}return b;}
function nacl(n,a){const atoms=[];for(let i=0;i<n;i++)for(let j=0;j<n;j++)for(let k=0;k<n;k++)
  atoms.push([(i+j+k)%2===0?'Na':'Cl',i*a,j*a,k*a]);return{atoms,bonds:autoBonds(atoms,a*1.06)};}
function diamond(){const a=3.567,base=[[0,0,0],[0,.5,.5],[.5,0,.5],[.5,.5,0],[.25,.25,.25],[.25,.75,.75],[.75,.25,.75],[.75,.75,.25]],atoms=[];
  for(let i=0;i<2;i++)for(let j=0;j<2;j++)for(let k=0;k<2;k++)base.forEach(p=>atoms.push(['C',(i+p[0])*a,(j+p[1])*a,(k+p[2])*a]));
  return{atoms,bonds:autoBonds(atoms,1.70)};}
function graphite(){const atoms=[],A1=[2.46,0],A2=[1.23,2.13],B=[[0,0],[1.23,0.71]];
  [[0,0,0],[1.23,0.71,3.35]].forEach(o=>{for(let i=0;i<3;i++)for(let j=0;j<3;j++)B.forEach(b=>
    atoms.push(['C',i*A1[0]+j*A2[0]+b[0]+o[0],i*A1[1]+j*A2[1]+b[1]+o[1],o[2]]));});
  return{atoms,bonds:autoBonds(atoms,1.60)};}
function fccMetal(sym,a){const base=[[0,0,0],[0,.5,.5],[.5,0,.5],[.5,.5,0]],atoms=[];
  for(let i=0;i<2;i++)for(let j=0;j<2;j++)for(let k=0;k<2;k++)base.forEach(p=>atoms.push([sym,(i+p[0])*a,(j+p[1])*a,(k+p[2])*a]));
  return{atoms,bonds:autoBonds(atoms,a*0.75)};}
/* 金紅石型：MnO₂（軟錳礦）。每個錳被 6 個氧圍成八面體，八面體再共邊連成長鏈 */
function rutile(sym,a,c,u,nx,ny,nz){
  const base=[[sym,0,0,0],[sym,.5,.5,.5],['O',u,u,0],['O',1-u,1-u,0],['O',.5+u,.5-u,.5],['O',.5-u,.5+u,.5]],atoms=[];
  for(let i=0;i<nx;i++)for(let j=0;j<ny;j++)for(let k=0;k<nz;k++)base.forEach(p=>
    atoms.push([p[0],(i+p[1])*a,(j+p[2])*a,(k+p[3])*c]));
  return{atoms,bonds:autoBonds(atoms,2.05)};}

/* 原子核座標（決定性亂數） */
const nucCache={};
function nucleus(sym){
  if(nucCache[sym])return nucCache[sym];
  const el=EL[sym],N=el.a,P=el.z;
  let seed=el.z*2654435761>>>0;
  const rnd=()=>{seed=(seed+0x6D2B79F5)>>>0;let t=seed;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};
  const nr=0.42/Math.max(1,Math.cbrt(N))*1.15;
  const R=Math.max(nr*Math.cbrt(N)*1.25-nr*0.6,0.001);
  const pts=[];
  for(let i=0;i<N;i++){
    let x,y,z;do{x=rnd()*2-1;y=rnd()*2-1;z=rnd()*2-1;}while(x*x+y*y+z*z>1);
    pts.push({x:x*R,y:y*R,z:z*R,p:i<P});
  }
  // 質子/中子交錯排列，看起來比較均勻
  for(let i=pts.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const a=pts[i].p;pts[i].p=pts[j].p;pts[j].p=a;}
  let assigned=0;pts.forEach(q=>{if(q.p)assigned++;});
  let diff=P-assigned,i=0;
  while(diff!==0&&i<pts.length){if(diff>0&&!pts[i].p){pts[i].p=true;diff--;}else if(diff<0&&pts[i].p){pts[i].p=false;diff++;}i++;}
  return nucCache[sym]={pts,nr};
}

  DPR=Math.min(devicePixelRatio||1,2);
  const b=cv.parentElement.getBoundingClientRect();
  W=Math.max(1,Math.round(b.width));H=Math.max(1,Math.round(b.height));
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);fit();
}
new ResizeObserver(resize).observe(document.querySelector('.stage'));

/* ==================== 繪圖 ==================== */
function rot(x,y,z){
  const cy=Math.cos(S.yaw),sy=Math.sin(S.yaw),cp=Math.cos(S.pitch),sp=Math.sin(S.pitch);
  const x1=x*cy+z*sy, z1=-x*sy+z*cy;
  return{x:x1,y:y*cp-z1*sp,z:y*sp+z1*cp};
}
function buildMolecule(){
  const st=curMol(),items=[];
  const P=st.atoms.map(a=>{const p=rot(a[1],a[2],a[3]);p.sym=a[0];return p;});
  if(S.mode!=='fill'){
    const SEG=14;
    st.bonds.forEach(b=>{
      const A=P[b[0]],B=P[b[1]];
      const offs=b[2]===3?[-0.17,0,0.17]:b[2]===2?[-0.135,0.135]:[0];
      let ox=0,oy=0;
      if(b[2]>1){const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy)||1;ox=-dy/L;oy=dx/L;}
      offs.forEach(o=>{for(let s=0;s<SEG;s++){
        const t0=s/SEG,t1=(s+1)/SEG,tm=(t0+t1)/2,near=tm<0.5?A:B;
        items.push({k:'k',x0:A.x+(B.x-A.x)*t0+ox*o,y0:A.y+(B.y-A.y)*t0+oy*o,z0:A.z+(B.z-A.z)*t0,
          x1:A.x+(B.x-A.x)*t1+ox*o,y1:A.y+(B.y-A.y)*t1+oy*o,z1:A.z+(B.z-A.z)*t1,
          z:A.z+(B.z-A.z)*tm,r:st.bondR,col:hex2rgb(EL[near.sym].color)});
      }});
    });
  }
  P.forEach(p=>items.push({k:'s',x:p.x,y:p.y,z:p.z,r:dispR(p.sym,st),
    col:hex2rgb(EL[p.sym].color),text:S.labels?p.sym:''}));
  return items;
}
function buildAtom(){
  const sym=S.elSym,el=EL[sym],items=[];
  const nuc=nucleus(sym);
  nuc.pts.forEach(q=>{const p=rot(q.x,q.y,q.z);
    items.push({k:'s',x:p.x,y:p.y,z:p.z,r:nuc.nr,col:q.p?PROTON:NEUTRON});});
  el.shells.forEach((cnt,k)=>{
    const R=shellR(k),tx=0.28+k*0.44,ty=k*0.72;
    const ct=Math.cos(tx),stx=Math.sin(tx),cy2=Math.cos(ty),sy2=Math.sin(ty);
    const at=a=>{ // 環上參數 a → 世界座標
      let x=R*Math.cos(a),y=R*Math.sin(a),z=0;
      let y2=y*ct-z*stx, z2=y*stx+z*ct;
      return[x*cy2+z2*sy2, y2, -x*sy2+z2*cy2];
    };
    const N=52;
    for(let i=0;i<N;i++){
      const a0=i/N*6.2832,a1=(i+1)/N*6.2832;
      const q0=at(a0),q1=at(a1),p0=rot(q0[0],q0[1],q0[2]),p1=rot(q1[0],q1[1],q1[2]);
      items.push({k:'k',x0:p0.x,y0:p0.y,z0:p0.z,x1:p1.x,y1:p1.y,z1:p1.z,
        z:(p0.z+p1.z)/2,r:0.012,col:[70,110,124],alpha:.85});
    }
    const w=0.55/(k*0.55+1);
    for(let e=0;e<cnt;e++){
      const a=S.t*w+e/cnt*6.2832;
      const q=at(a),p=rot(q[0],q[1],q[2]);
      items.push({k:'s',x:p.x,y:p.y,z:p.z,r:0.105,col:ELECTRON,glow:1});
    }
    if(S.labels){
      const q=at(-0.35),p=rot(q[0]*1.09,q[1]*1.09,q[2]*1.09);
      items.push({k:'t',x:p.x,y:p.y,z:p.z,text:String(cnt),col:[130,190,205]});
    }
  });
  return items;
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const items=S.view==='element'?buildAtom():buildMolecule();
  let zmin=Infinity,zmax=-Infinity;
  items.forEach(it=>{const z=it.z;if(z<zmin)zmin=z;if(z>zmax)zmax=z;});
  const span=Math.max(zmax-zmin,.001);
  items.sort((a,b)=>a.z-b.z);

  for(const it of items){
    const zc=S.dist-it.z; if(zc<0.4) continue;
    const k=S.focal/zc, fog=Math.min(Math.max((zmax-it.z)/span,0),1)*0.5;
    const base=fogMix(it.col,fog);

    if(it.k==='k'){
      const z0=S.dist-it.z0,z1=S.dist-it.z1; if(z0<0.4||z1<0.4)continue;
      const k0=S.focal/z0,k1=S.focal/z1;
      ctx.globalAlpha=it.alpha||1;
      ctx.strokeStyle=shade(base,-0.15);
      ctx.lineWidth=Math.max(0.8,2*it.r*k);ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(W/2+it.x0*k0,H/2-it.y0*k0);ctx.lineTo(W/2+it.x1*k1,H/2-it.y1*k1);ctx.stroke();
      ctx.globalAlpha=1;continue;
    }
    const px=W/2+it.x*k, py=H/2-it.y*k;
    if(it.k==='t'){
      ctx.font='700 13px '+'ui-monospace,SFMono-Regular,Menlo,monospace';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=rgbS(base);ctx.fillText(it.text,px,py);continue;
    }
    const pr=it.r*k; if(pr<0.4)continue;
    if(it.glow){
      const gg=ctx.createRadialGradient(px,py,0,px,py,pr*3.4);
      gg.addColorStop(0,'rgba(99,217,224,.34)');gg.addColorStop(1,'rgba(99,217,224,0)');
      ctx.fillStyle=gg;ctx.beginPath();ctx.arc(px,py,pr*3.4,0,6.2832);ctx.fill();
    }
    const g=ctx.createRadialGradient(px-pr*.36,py-pr*.42,pr*.04,px,py,pr*1.02);
    g.addColorStop(0,shade(base,.62));g.addColorStop(.42,rgbS(base));g.addColorStop(1,shade(base,-.6));
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,pr,0,6.2832);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=Math.max(.5,pr*.05);ctx.stroke();

    if(it.text&&pr>8){
      const fs=Math.min(Math.max(pr*.8,10),26);
      ctx.font=`700 ${fs}px ui-monospace,SFMono-Regular,Menlo,monospace`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle=lum(base)>.6?'rgba(8,18,24,.85)':'rgba(255,255,255,.94)';
      ctx.fillText(it.text,px,py+fs*.04);
    }
  }
}
let last=performance.now();
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  if(S.spin&&!drag.on)S.yaw+=S.speed*dt;
  S.t+=dt*(S.spin?1:0.35);
  draw();requestAnimationFrame(loop);
}

/* ==================== 互動 ==================== */
const drag={on:false,x:0,y:0,pts:new Map(),pinch:0};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);
  drag.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(drag.pts.size===1){drag.on=true;drag.x=e.clientX;drag.y=e.clientY;}
  if(drag.pts.size===2){const p=[...drag.pts.values()];drag.pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);}});
cv.addEventListener('pointermove',e=>{
  if(!drag.pts.has(e.pointerId))return;
  drag.pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(drag.pts.size===2){const p=[...drag.pts.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if(drag.pinch)setZoom(S.zoomUI*(d/drag.pinch));drag.pinch=d;return;}
  if(!drag.on)return;
  S.yaw+=(e.clientX-drag.x)*.008;
  S.pitch=Math.max(-1.5,Math.min(1.5,S.pitch+(e.clientY-drag.y)*.008));
  drag.x=e.clientX;drag.y=e.clientY;});
const endPt=e=>{drag.pts.delete(e.pointerId);if(drag.pts.size<2)drag.pinch=0;if(!drag.pts.size)drag.on=false;};
cv.addEventListener('pointerup',endPt);cv.addEventListener('pointercancel',endPt);
cv.addEventListener('wheel',e=>{e.preventDefault();setZoom(S.zoomUI*(e.deltaY<0?1.09:.917));},{passive:false});
cv.addEventListener('keydown',e=>{const k=e.key;
  if(k==='ArrowLeft')S.yaw-=.1;else if(k==='ArrowRight')S.yaw+=.1;
  else if(k==='ArrowUp')S.pitch=Math.max(-1.5,S.pitch-.1);
  else if(k==='ArrowDown')S.pitch=Math.min(1.5,S.pitch+.1);
  else if(k==='+'||k==='=')setZoom(S.zoomUI*1.1);else if(k==='-')setZoom(S.zoomUI/1.1);else return;
  e.preventDefault();});
function setZoom(z){S.zoomUI=Math.max(.6,Math.min(2.2,z));$('zoom').value=Math.round(S.zoomUI*100);fit();readout();}

/* ==================== 介面 ==================== */
const GA={1:'1A',2:'2A',13:'3A',14:'4A',15:'5A',16:'6A',17:'7A',18:'8A'};
const CCOL={1:1,2:2,13:3,14:4,15:5,16:6,17:7,18:8};
function makeEl(sym){
  const e=EL[sym],b=document.createElement('button');
  b.className='el'+(e.rad?' rad':'');b.type='button';b.dataset.cat=e.cat;b.dataset.sym=sym;
  b.setAttribute('aria-pressed',sym===S.elSym);
  b.innerHTML=`<span class="z">${e.z}</span><span class="s">${sym}</span><span class="n">${e.zh.charAt(0)}</span>`;
  b.onclick=()=>pickEl(sym);
  return b;
}
function buildTable(){
  const compact=S.layout==='compact';
  $('pwrap').className='pwrap '+(compact?'compact':'full');
  const hd=$('phead'),g=$('ptable'),tm=$('tmrow');
  hd.innerHTML='';g.innerHTML='';tm.innerHTML='';
  $('layoutBtn').textContent=compact?'切換為完整週期表':'切換為主族排列';

  const cols=compact?8:18;
  for(let c=1;c<=cols;c++){
    const real=compact?Object.keys(CCOL).find(k=>CCOL[k]===c):c;
    const d=document.createElement('div');
    d.className='gcol'+(GA[real]?' ga':'');d.textContent=GA[real]||c;
    d.style.gridColumn=c;d.style.gridRow=1;hd.appendChild(d);
  }
  if(compact){
    slot(g,1,1);slot(g,8,1);
    for(let r=2;r<=6;r++)for(let c=1;c<=8;c++)slot(g,c,r);
    slot(g,1,7);slot(g,2,7);
  }else{
    tableSlots().forEach(([c,r])=>slot(g,c,r));
  }
  /* 主族排列時，非主族的元素放不進 8 欄格線，改列在表格下方 */
  const extra=[];
  EL_ORDER.forEach(sym=>{
    const e=EL[sym];
    if(compact&&!GA[e.col]){extra.push(sym);return;}
    const b=makeEl(sym);
    b.style.gridColumn=compact?CCOL[e.col]:e.col;
    b.style.gridRow=e.row;
    g.appendChild(b);
  });
  if(!compact&&EL_ORDER.some(s=>EL[s].fblock)){
    const lab=document.createElement('span');lab.className='fnlab';lab.textContent='錒系';
    g.appendChild(lab);
  }
  extra.sort((x,y)=>EL[x].z-EL[y].z).forEach(sym=>tm.appendChild(makeEl(sym)));
  $('tmwrap').classList.toggle('hide',!extra.length);
}
function slot(g,c,r){const d=document.createElement('div');d.className='cell';
  d.style.gridColumn=c;d.style.gridRow=r;g.appendChild(d);}
function buildChips(){
  const mk=(list,host)=>{host.innerHTML='';list.forEach(s=>{
    const b=document.createElement('button');b.className='chip';b.type='button';b.dataset.id=s.id;
    b.setAttribute('aria-pressed',MOL.indexOf(s)===S.molIdx);
    b.innerHTML=`${s.name} <small>${s.short}</small>`;
    b.onclick=()=>pickMol(MOL.indexOf(s));host.appendChild(b);});};
  const a=$('chipsA'),b=$('chipsB');
  a.innerHTML='';b.innerHTML='';
  const l1=document.createElement('span');l1.className='lab';l1.textContent='分子';a.appendChild(l1);
  const l2=document.createElement('span');l2.className='lab';l2.textContent='晶體';b.appendChild(l2);
  const tmpA=document.createElement('div'),tmpB=document.createElement('div');
  mk(MOL.filter(s=>s.g==='A'),tmpA);mk(MOL.filter(s=>s.g==='B'),tmpB);
  [...tmpA.children].forEach(c=>a.appendChild(c));
  [...tmpB.children].forEach(c=>b.appendChild(c));
}
function buildMnemo(){
  const host=$('mnemo');host.innerHTML='';
  const row=(labText,list,withAll)=>{
    const r=document.createElement('div');r.className='mnemo';
    const lab=document.createElement('span');lab.className='lab';lab.textContent=labText;r.appendChild(lab);
    if(withAll){
      const all=document.createElement('button');
      all.className='mbtn';all.type='button';all.dataset.mid='';all.textContent='全部';
      all.setAttribute('aria-pressed',!S.mnemo);all.onclick=()=>pickMnemo(null);r.appendChild(all);
    }
    list.forEach(m=>{
      const b=document.createElement('button');
      b.className='mbtn';b.type='button';b.dataset.mid=m.id;b.textContent=m.title;
      b.setAttribute('aria-pressed',S.mnemo===m.id);
      b.onclick=()=>pickMnemo(m.id);r.appendChild(b);
    });
    host.appendChild(r);
  };
  row('主族',FAMILY,true);
  row('口訣',MNEMO,false);
}
function pickMnemo(id){
  S.mnemo=id;
  document.querySelectorAll('.mbtn').forEach(b=>b.setAttribute('aria-pressed',(b.dataset.mid||null)===id));
  const m=SETS.find(x=>x.id===id);
  $('mband').classList.toggle('hide',!m);
  document.querySelectorAll('.el').forEach(b=>b.classList.toggle('dim',!!m&&!m.seq.includes(b.dataset.sym)));
  if(!m)return;
  $('mSay').textContent=m.text;$('mNote').textContent=m.note;
  const bar=$('mSeq');bar.innerHTML='';
  m.seq.forEach((sym,i)=>{
    const e=EL[sym],b=document.createElement('button');
    b.className='seq';b.type='button';b.dataset.sym=sym;
    b.setAttribute('aria-current',sym===S.elSym);
    b.innerHTML=`<span class="o">${i+1}</span><span class="c">${e.zh.charAt(0)}</span><span class="y">${sym}</span>`;
    b.onclick=()=>pickEl(sym);bar.appendChild(b);
  });
  if(!m.seq.includes(S.elSym))pickEl(m.seq[0]);
}
function pickEl(sym){S.elSym=sym;S.view='element';S.yaw=.6;S.pitch=-.3;
  document.querySelectorAll('.el').forEach(b=>b.setAttribute('aria-pressed',b.dataset.sym===sym));
  document.querySelectorAll('.seq').forEach(b=>{
    b.setAttribute('aria-current',b.dataset.sym===sym);
    if(b.dataset.sym===sym)b.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
  });
  fit();panel();}
function pickMol(i){S.molIdx=i;S.view='structure';S.yaw=.6;S.pitch=-.3;
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===MOL[i].id));
  fit();panel();}

function panel(){
  const isEl=S.view==='element';
  $('modeGroup').classList.toggle('hide',isEl);
  if(isEl){
    const e=EL[S.elSym];
    $('tName').textContent=e.zh;$('tFormula').textContent=S.elSym;
    $('tBadge').textContent=e.cat+' · '+e.state+(e.rad?' · 放射性':'');
    $('tag').textContent=S.elSym+' · 原子模型';
    $('tFacts').innerHTML=[
      ['原子序（質子數）',e.z],['質量數',e.a],['中子數',e.a-e.z],['電子數',e.z],
      ['電子排列',e.shells.join(' , ')]
    ].map(f=>`<dt>${f[0]}</dt><dd>${f[1]}</dd>`).join('');
    $('tNote').textContent=e.use+'　（圖為波耳模型：電子畫成一層一層的軌道，方便理解。真實原子的原子核只有整顆原子的約十萬分之一大，這裡放大了很多倍。）';
    $('legend').innerHTML=[
      ['#ff6a53','質子','帶正電，數量＝原子序'],
      ['#8fa3ad','中子','不帶電，位於原子核'],
      ['#63d9e0','電子','帶負電，分層繞著原子核']
    ].map(r=>`<div class="lrow"><span class="sw" style="background:${r[0]}"></span>
      <span class="sy">${r[1]}</span><span class="nm">${r[2]}</span></div>`).join('');
  }else{
    const st=curMol();
    $('tName').textContent=st.name;$('tFormula').textContent=st.formula;
    $('tBadge').textContent=st.badge;$('tag').textContent=st.formula;
    $('tFacts').innerHTML=st.facts.map(f=>`<dt>${f[0]}</dt><dd>${f[1]}</dd>`).join('');
    $('tNote').textContent=st.note;
    const syms=[...new Set(st.atoms.map(a=>a[0]))];
    $('legend').innerHTML=syms.map(s=>`<div class="lrow"><span class="sw" style="background:${EL[s].color}"></span>
      <span class="sy">${s}</span><span class="nm">${EL[s].zh}</span></div>`).join('');
  }
  readout();
}
function readout(){
  if(S.view==='element'){
    const e=EL[S.elSym];
    $('readout').innerHTML=`原子核：質子 <b>${e.z}</b>　中子 <b>${e.a-e.z}</b><br>電子 <b>${e.z}</b>　分 <b>${e.shells.length}</b> 層　視野 <b>${(S.zoomUI*100).toFixed(0)}%</b>`;
  }else{
    const st=curMol();
    $('readout').innerHTML=`原子 <b>${st.atoms.length}</b>　鍵結 <b>${st.bonds.length}</b><br>模式 <b>${S.mode==='ball'?'球棍':'實體'}</b>　視野 <b>${(S.zoomUI*100).toFixed(0)}%</b>`;
  }
}
function setTab(el){
  S.view=el?'element':'structure';
  $('tabEl').setAttribute('aria-selected',el);$('tabMol').setAttribute('aria-selected',!el);
  $('pickEl').classList.toggle('hide',!el);$('pickMol').classList.toggle('hide',el);
  fit();panel();
}
$('tabEl').onclick=()=>setTab(true);
$('tabMol').onclick=()=>setTab(false);
document.querySelectorAll('[data-mode]').forEach(b=>{b.onclick=()=>{S.mode=b.dataset.mode;
  document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));fit();readout();};});
$('btnLabel').onclick=e=>{S.labels=!S.labels;e.currentTarget.setAttribute('aria-pressed',S.labels);};
$('btnSpin').onclick=e=>{S.spin=!S.spin;e.currentTarget.setAttribute('aria-pressed',S.spin);};
$('speed').oninput=e=>{S.speed=e.target.value/100;};
$('zoom').oninput=e=>setZoom(e.target.value/100);
$('layoutBtn').onclick=()=>{S.layoutManual=true;S.layout=S.layout==='compact'?'full':'compact';buildTable();pickMnemo(S.mnemo);};
/* 旋轉手機或改變視窗寬度時，若使用者未手動切換過，自動選較合適的排列 */
const onNarrow=e=>{
  if(S.layoutManual)return;
  const want=e.matches?'compact':'full';
  if(want===S.layout)return;
  S.layout=want;buildTable();pickMnemo(S.mnemo);
};
if(narrow.addEventListener)narrow.addEventListener('change',onNarrow);else narrow.addListener(onNarrow);
$('reset').onclick=()=>{S.yaw=.6;S.pitch=-.3;setZoom(1);};

buildTable();buildMnemo();buildChips();resize();panel();requestAnimationFrame(loop);
})();
</script>
